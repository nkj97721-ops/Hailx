name: Apply patch

on:
  push:
    branches:
      - refactor
    paths:
      - 'patch/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Repair misplaced files
        run: |
          if [ -f colors.xml ] && grep -q 'namespace = "com.aistra.hail"' build.gradle.kts; then
            git show origin/main:build.gradle.kts > root.build.gradle.kts.orig
            mv -f build.gradle.kts app/build.gradle.kts
            mv -f root.build.gradle.kts.orig build.gradle.kts
            mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml
            mv -f colors.xml app/src/main/res/values/colors.xml
            mv -f themes.xml app/src/main/res/values/themes.xml
            for f in ic_launcher_background ic_launcher_foreground ic_launcher_monochrome; do
              mv -f $f.xml app/src/main/res/drawable/$f.xml
            done
          fi
      - name: Apply patch zip
        run: |
          if [ -f patch/patch.zip ]; then
            unzip -o -q patch/patch.zip -d .
            if [ -f delete.txt ]; then
              while IFS= read -r p; do
                [ -n "$p" ] && git rm -r -q -f --ignore-unmatch "$p"
              done < delete.txt
              rm -f delete.txt
            fi
            rm -rf patch
          fi
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply patch"
          git push
      - name: Trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --ref refactor
